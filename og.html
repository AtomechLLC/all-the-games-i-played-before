<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #17161B; color: #ECEAE4; }
  .wrap { padding: 54px 64px 40px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; }
  h1 { font-family: Silkscreen, monospace; font-weight: 700; font-size: 52px; line-height: 1.18; margin: 0; letter-spacing: 1px; }
  h1 .r { color: #FF6A5C; }
  .stats { display: flex; gap: 46px; margin-top: 24px; }
  .stats span { font-family: "IBM Plex Mono", monospace; font-size: 14px; letter-spacing: 2px; color: #98948D; }
  .stats b { font-family: Silkscreen, monospace; font-weight: 700; font-size: 28px; color: #E5B84B; margin-right: 10px; }
  .tl { display: flex; align-items: flex-end; gap: 4px; height: 160px; margin-top: auto; border-bottom: 2px solid #34323B; padding-bottom: 2px; }
  .tl div { flex: 1; border-radius: 2px 2px 0 0; }
  .foot { display: flex; justify-content: space-between; margin-top: 18px; font-family: "IBM Plex Mono", monospace; font-size: 15px; color: #98948D; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ALL THE GAMES<br>I PLAYED <span class="r">BEFORE</span></h1>
  <div class="stats">
    <span><b>1972–2026</b> ERAS</span>
    <span><b>33</b> PLATFORMS</span>
    <span><b>1222</b> GAMES</span>
    <span><b>89</b> BADGES</span>
  </div>
  <div class="tl" id="tl"></div>
  <div class="foot"><span>atomechllc.github.io/all-the-games-i-played-before</span><span>funsmith.club</span></div>
</div>
<script>
const COLORS = {ATARI:"#C46A3A",NES:"#B0453C",SNES:"#7A6FD0",GEN:"#1A66C4",GG:"#8E3B62",GB:"#8FA04C",GBC:"#2FA79A",GBA:"#5E6FD8",N64:"#3E9C5C",SAT:"#21A366",PSX:"#90939E",DC:"#F2703F",GCN:"#8C63C8",PS2:"#3244C7",XBX:"#107C10",NDS:"#C75B9B",PSP:"#3A3F8F",WII:"#5CA8DC",X360:"#7EBB00",PS3:"#B33A75","3DS":"#16A3B8",WIIU:"#2F7FC1",PS4:"#46627F",XONE:"#58B947",NSW:"#E8443F",PS5:"#0E7ECD",VR:"#A64DF0",MOB:"#FF8A3D",IBM:"#8A8FA3",OS2:"#2AA198",ARC:"#F0C020",PC1:"#C98A2E",PC2:"#4E82C6"};
fetch("owner-list.json").then(r => r.json()).then(o => {
  const byY = {}, plat = {};
  o.ids.forEach(id => {
    const parts = id.split("-");
    const y = +parts[1];
    if (!y) return;
    byY[y] = (byY[y] || 0) + 1;
    (plat[y] = plat[y] || {})[parts[0]] = (plat[y][parts[0]] || 0) + 1;
  });
  const max = Math.max(...Object.values(byY));
  const tl = document.getElementById("tl");
  for (let y = 1972; y <= 2026; y++) {
    const d = document.createElement("div");
    const n = byY[y] || 0;
    d.style.height = n ? Math.max(6, 156 * n / max) + "px" : "3px";
    let c = "#2A2931";
    if (n) {
      let best = null;
      for (const k in plat[y]) if (!best || plat[y][k] > plat[y][best]) best = k;
      c = COLORS[best] || "#E5B84B";
    }
    d.style.background = c;
    tl.appendChild(d);
  }
});
</script>
</body>
</html>
